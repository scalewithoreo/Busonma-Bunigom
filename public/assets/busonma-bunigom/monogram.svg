<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="2000" height="2000">
  <defs>
    <!-- Soft luxury glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear gradient for subtle luxury luster -->
    <linearGradient id="whiteShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#FDFBF7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F2EDE4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Infinity loop stroke gradient -->
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="50%" stop-color="#EADBCE" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Outer Delicate Luxury Circular Border Frame (Like Ore & Dara / M&M) -->
  <g fill="none" stroke="#FFFFFF">
    <!-- Primary Outer Ring -->
    <circle cx="500" cy="500" r="455" stroke-width="2" stroke-opacity="0.75" />
    <!-- Fine Inner Dotted Ring -->
    <circle cx="500" cy="500" r="442" stroke-width="1.2" stroke-dasharray="3 7" stroke-opacity="0.6" />
    <!-- Tertiary Inner Hairline Ring -->
    <circle cx="500" cy="500" r="428" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Cardinal Luxury Diamond Stars -->
    <polygon points="500,32 506,45 500,58 494,45" fill="#FFFFFF" stroke="none" opacity="0.9" />
    <polygon points="500,942 506,955 500,968 494,955" fill="#FFFFFF" stroke="none" opacity="0.9" />
    <polygon points="32,500 45,506 58,500 45,494" fill="#FFFFFF" stroke="none" opacity="0.9" />
    <polygon points="942,500 955,506 968,500 955,494" fill="#FFFFFF" stroke="none" opacity="0.9" />

    <!-- Corner Star Flourishes at 45 degree diagonals -->
    <circle cx="187" cy="187" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.7" />
    <circle cx="813" cy="187" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.7" />
    <circle cx="187" cy="813" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.7" />
    <circle cx="813" cy="813" r="2.5" fill="#FFFFFF" stroke="none" opacity="0.7" />
  </g>

  <!-- Central Monogram: Two Interlocking Serif B's -->
  <!-- Upper Left B -->
  <g transform="translate(410, 435)" filter="url(#softGlow)">
    <!-- Vertical Main Stem -->
    <rect x="-115" y="-155" width="22" height="310" rx="2" fill="url(#whiteShine)" />
    <!-- Top bracketed serif -->
    <polygon points="-140,-155 -90,-155 -100,-143 -115,-143 -115,-155" fill="url(#whiteShine)" />
    <polygon points="-90,-155 -115,-155 -115,-143 -93,-143" fill="url(#whiteShine)" />
    <!-- Bottom bracketed serif -->
    <polygon points="-140,155 -90,155 -100,143 -115,143 -115,155" fill="url(#whiteShine)" />
    <!-- Top Horizontal Bar -->
    <path d="M -115,-155 L -10,-155 C 55,-155 95,-130 95,-75 C 95,-25 55,-3 0,-3 L -115,-3 Z" 
          fill="none" stroke="url(#whiteShine)" stroke-width="18" stroke-linejoin="round" />
    <!-- Bottom Horizontal Bar -->
    <path d="M -115,-3 L 10,-3 C 75,-3 118,22 118,78 C 118,135 75,155 0,155 L -115,155 Z" 
          fill="none" stroke="url(#whiteShine)" stroke-width="20" stroke-linejoin="round" />
  </g>

  <!-- Lower Right B -->
  <g transform="translate(565, 545)" filter="url(#softGlow)">
    <!-- Vertical Main Stem -->
    <rect x="-115" y="-155" width="22" height="310" rx="2" fill="url(#whiteShine)" />
    <!-- Top bracketed serif -->
    <polygon points="-140,-155 -90,-155 -100,-143 -115,-143 -115,-155" fill="url(#whiteShine)" />
    <!-- Bottom bracketed serif -->
    <polygon points="-140,155 -90,155 -100,143 -115,143 -115,155" fill="url(#whiteShine)" />
    <!-- Top Horizontal Bar -->
    <path d="M -115,-155 L -10,-155 C 55,-155 95,-130 95,-75 C 95,-25 55,-3 0,-3 L -115,-3 Z" 
          fill="none" stroke="url(#whiteShine)" stroke-width="18" stroke-linejoin="round" />
    <!-- Bottom Horizontal Bar -->
    <path d="M -115,-3 L 10,-3 C 75,-3 118,22 118,78 C 118,135 75,155 0,155 L -115,155 Z" 
          fill="none" stroke="url(#whiteShine)" stroke-width="20" stroke-linejoin="round" />
  </g>

  <!-- Flowing 3D Infinity Ribbon weaving between the two B's -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Under Shadow / Outer border of ribbon for high contrast -->
    <path d="M 490,490 C 430,415 310,415 310,490 C 310,565 430,565 490,490 C 550,415 670,415 670,490 C 670,565 550,565 490,490 Z" 
          stroke="#141210" stroke-width="16" stroke-opacity="0.35" />
    <!-- Main Infinity Ribbon Line -->
    <path d="M 490,490 C 430,415 310,415 310,490 C 310,565 430,565 490,490 C 550,415 670,415 670,490 C 670,565 550,565 490,490 Z" 
          stroke="url(#infinityGrad)" stroke-width="8.5" />
    <!-- Fine Core Highlight Line -->
    <path d="M 490,490 C 430,415 310,415 310,490 C 310,565 430,565 490,490 C 550,415 670,415 670,490 C 670,565 550,565 490,490 Z" 
          stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.95" />
  </g>

  <!-- Elegant Bottom Crest Inscription -->
  <!-- Laurel sprig left -->
  <path d="M 330,775 C 370,785 410,790 450,792 M 360,780 C 352,772 355,765 365,770 M 390,785 C 385,775 392,769 400,776 M 420,789 C 418,778 426,773 433,781" 
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <!-- Laurel sprig right -->
  <path d="M 670,775 C 630,785 590,790 550,792 M 640,780 C 648,772 645,765 635,770 M 610,785 C 615,775 608,769 600,776 M 580,789 C 582,778 574,773 567,781" 
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <text x="500" y="796" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="22" 
        font-weight="600" 
        letter-spacing="10" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        opacity="0.95">EST. 2027</text>

  <text x="500" y="836" 
        font-family="'Montserrat', 'Cinzel', 'Helvetica Neue', sans-serif" 
        font-size="18" 
        font-weight="400" 
        letter-spacing="14" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        opacity="0.85">BUSONMA &amp; BUNIGOM</text>
</svg>